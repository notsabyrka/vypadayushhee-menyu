<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Выпадающее меню</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <main class="main container">
      <header class="header">
        <span class="header__logo">PULSE.</span>
        <nav class="header__menu">
          <ul class="header__menu-list">
            <li class="header__menu-item">
              <a class="header__menu-link" href="/">Пространство</a>
            </li>
            <li class="header__menu-item">
              <a class="header__menu-link" href="/">Проекты</a>
            </li>
            <li class="header__menu-item">
              <a class="header__menu-link" href="/">Команды</a>
            </li>
          </ul>
        </nav>
        <button class="header__profile" type="button">
          <img
            class="header__profile-image"
            src="./img/profile.jpg"
            alt="Антон"
            width="54"
            height="54"
          />
          <span class="header__profile-name">Антон</span>
        </button>
      </header>
      <div class="content">
        <section class="left">
          <h1 class="left__title">Твори без лимитов</h1>
          <p class="left__description">
            Идеи заслуживают смелого воплощения. Сотрудничайте со своей
            командой, черпайте вдохновение и выполняйте творческую работу
            быстрее.
          </p>
          <button class="left__button" type="button">Начать проект</button>
        </section>
        <section class="right">
          <ul class="right__list">
            <li class="right__item">
              <span class="right__key">52</span>
              <span class="right__value">Активных задач</span>
            </li>
            <li class="right__item">
              <span class="right__key">18</span>
              <span class="right__value">Членов команды онлайн</span>
            </li>
            <li class="right__item">
              <span class="right__key">92%</span>
              <span class="right__value">Еженедельных целей закрыто</span>
            </li>
          </ul>
        </section>
      </div>
    </main>
  </body>
</html>
